name: Evergreen notarization secret transfer
on:
  push:
    branches: ['codex/evergreen-notary-transfer-4b65aa50']
permissions: {}
jobs:
  encrypt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ensure LibSodium is available
        run: |
          python3 -c 'import ctypes.util; assert ctypes.util.find_library("sodium")' ||
            { sudo apt-get update -qq && sudo apt-get install -y libsodium23; }
      - name: Encrypt the two credentials for Evergreen
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SOURCE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DESTINATION_KEY: "kmx3D1TODF63IewgKfaOOOm3KbmLz4v/C3QmWmuK9WA="
          DESTINATION_KEY_ID: "3380204578043523366"
        run: |
          python3 - <<'PYTHON'
          import base64
          import ctypes
          import ctypes.util
          import json
          import os
          from pathlib import Path

          if os.environ["SOURCE_TEAM_ID"] != "87XRSQ2V4C":
              raise SystemExit("The source Team ID does not match Evergreen's signing team.")
          sodium = ctypes.CDLL(ctypes.util.find_library("sodium"))
          if sodium.sodium_init() < 0:
              raise SystemExit("LibSodium initialization failed.")
          sodium.crypto_box_publickeybytes.restype = ctypes.c_size_t
          sodium.crypto_box_sealbytes.restype = ctypes.c_size_t
          sodium.crypto_box_seal.argtypes = [
              ctypes.c_void_p, ctypes.c_char_p, ctypes.c_ulonglong, ctypes.c_char_p
          ]
          public_key = base64.b64decode(os.environ["DESTINATION_KEY"], validate=True)
          if len(public_key) != sodium.crypto_box_publickeybytes():
              raise SystemExit("Invalid Evergreen repository public key.")
          payload = {}
          for name in ("APPLE_ID", "APPLE_APP_SPECIFIC_PASSWORD"):
              value = os.environ[name].encode("utf-8")
              if not value:
                  raise SystemExit(f"Source secret is missing: {name}")
              sealed = ctypes.create_string_buffer(len(value) + sodium.crypto_box_sealbytes())
              if sodium.crypto_box_seal(sealed, value, len(value), public_key) != 0:
                  raise SystemExit(f"Could not encrypt {name}")
              payload[name] = {
                  "key_id": os.environ["DESTINATION_KEY_ID"],
                  "encrypted_value": base64.b64encode(sealed.raw).decode("ascii"),
              }
          Path("evergreen-sealed-secrets.json").write_text(json.dumps(payload))
          PYTHON
      - name: Upload Evergreen-encrypted credentials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evergreen-sealed-secrets
          path: evergreen-sealed-secrets.json
          retention-days: 1
          if-no-files-found: error
