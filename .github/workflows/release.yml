name: release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.gif'
      - '**.svg'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  orchestrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      include_cli: ${{ steps.meta.outputs.include_cli }}
      include_desktop: ${{ steps.meta.outputs.include_desktop }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_body: ${{ steps.meta.outputs.release_body }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            cli:
              - 'cli/**'
            app:
              - 'app/**'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Refresh tags
        run: git fetch --tags --force

      - name: Compute release metadata
        id: meta
        run: |
          CLI_CHANGED=${{ steps.filter.outputs.cli || 'false' }}
          APP_CHANGED=${{ steps.filter.outputs.app || 'false' }}

          # Force true if manual dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLI_CHANGED=true
            APP_CHANGED=true
          fi

          if [ "$CLI_CHANGED" = "true" ] && [ "$APP_CHANGED" = "true" ]; then
            INCLUDE_CLI=true
            INCLUDE_DESKTOP=true
          elif [ "$CLI_CHANGED" = "true" ]; then
            INCLUDE_CLI=true
            INCLUDE_DESKTOP=false
          elif [ "$APP_CHANGED" = "true" ]; then
            INCLUDE_CLI=false
            INCLUDE_DESKTOP=true
          else
            INCLUDE_CLI=false
            INCLUDE_DESKTOP=false
          fi

          VERSION=$(bun .github/scripts/release-coordinator.mjs next-version --include-cli "$INCLUDE_CLI" --include-desktop "$INCLUDE_DESKTOP")
          TAG="v${VERSION}"
          RELEASE_BODY=$(bun .github/scripts/release-coordinator.mjs release-body --include-cli "$INCLUDE_CLI" --include-desktop "$INCLUDE_DESKTOP" --version "$VERSION")

          echo "include_cli=${INCLUDE_CLI}" >> "$GITHUB_OUTPUT"
          echo "include_desktop=${INCLUDE_DESKTOP}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "release_body<<EOF"
            echo "$RELEASE_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-cli:
    needs: orchestrate
    if: needs.orchestrate.outputs.include_cli == 'true'
    runs-on: ubuntu-latest
    env:
      MCPX_POSTHOG_PROJECT_TOKEN: ${{ vars.MCPX_POSTHOG_PROJECT_TOKEN }}
      MCPX_POSTHOG_HOST: ${{ vars.MCPX_POSTHOG_HOST }}
      MCPX_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      MCPX_SENTRY_RELEASE: mcpx@${{ needs.orchestrate.outputs.version }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: cli

      - name: Build
        run: bun run build
        working-directory: cli

      - name: Test
        run: bun run test
        working-directory: cli

      - name: Upload private CLI source maps
        uses: actions/upload-artifact@v6
        with:
          name: cli-sourcemaps
          path: cli/dist/**/*.js.map
          if-no-files-found: ignore

      - name: Remove source maps before packaging
        run: bun .github/scripts/remove-sourcemaps.mjs cli/dist

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set release versions
        run: |
          bun -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${{ needs.orchestrate.outputs.version }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          bun run sync-version
        working-directory: cli

      - name: Pack CLI tarball
        run: npm pack
        working-directory: cli

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v6
        with:
          name: cli-dist
          path: cli/dist/

      - name: Upload CLI tarball
        uses: actions/upload-artifact@v6
        with:
          name: cli-tarball
          path: cli/*.tgz

  build-desktop-macos:
    needs: orchestrate
    if: needs.orchestrate.outputs.include_desktop == 'true'
    runs-on: macos-15
    env:
      MCPX_POSTHOG_PROJECT_TOKEN: ${{ vars.MCPX_POSTHOG_PROJECT_TOKEN }}
      MCPX_POSTHOG_HOST: ${{ vars.MCPX_POSTHOG_HOST }}
      MCPX_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      MCPX_SENTRY_RELEASE: mcpx@${{ needs.orchestrate.outputs.version }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile
        working-directory: cli

      - name: Build CLI for desktop daemon
        run: bun run build
        working-directory: cli

      - name: Upload private bundled CLI source maps (macOS)
        uses: actions/upload-artifact@v6
        with:
          name: desktop-cli-sourcemaps-macos
          path: cli/dist/**/*.js.map
          if-no-files-found: ignore

      - name: Remove bundled CLI source maps before packaging (macOS)
        run: bun .github/scripts/remove-sourcemaps.mjs cli/dist

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile
        working-directory: app

      - name: Set desktop version for build
        run: bun -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${{ needs.orchestrate.outputs.version }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
        working-directory: app

      - name: Build desktop bundle
        run: bun run build
        working-directory: app

      - name: Upload private macOS source maps
        uses: actions/upload-artifact@v6
        with:
          name: desktop-sourcemaps-macos
          path: app/out/**/*.map
          if-no-files-found: ignore

      - name: Remove source maps before packaging
        run: bun .github/scripts/remove-sourcemaps.mjs app/out

      - name: Test desktop end-to-end
        run: bun run e2e
        working-directory: app

      - name: Determine signing mode
        id: signing_mode
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then
              missing+=("${var}")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package macOS app (signed + notarized)
        if: steps.signing_mode.outputs.enabled == 'true'
        run: bunx electron-builder build --mac --universal --publish never
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package macOS app (unsigned)
        if: steps.signing_mode.outputs.enabled != 'true'
        run: bunx electron-builder build --mac --universal --publish never
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS desktop artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-dist-macos
          path: |
            app/dist/**/*.dmg
            app/dist/**/*.zip
            app/dist/**/*.blockmap
            app/dist/**/latest*.yml

  build-desktop-linux:
    needs: orchestrate
    if: needs.orchestrate.outputs.include_desktop == 'true'
    runs-on: ubuntu-latest
    env:
      MCPX_POSTHOG_PROJECT_TOKEN: ${{ vars.MCPX_POSTHOG_PROJECT_TOKEN }}
      MCPX_POSTHOG_HOST: ${{ vars.MCPX_POSTHOG_HOST }}
      MCPX_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      MCPX_SENTRY_RELEASE: mcpx@${{ needs.orchestrate.outputs.version }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile
        working-directory: cli

      - name: Build CLI for desktop daemon
        run: bun run build
        working-directory: cli

      - name: Upload private bundled CLI source maps (Linux)
        uses: actions/upload-artifact@v6
        with:
          name: desktop-cli-sourcemaps-linux
          path: cli/dist/**/*.js.map
          if-no-files-found: ignore

      - name: Remove bundled CLI source maps before packaging (Linux)
        run: bun .github/scripts/remove-sourcemaps.mjs cli/dist

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile
        working-directory: app

      - name: Set desktop version for build
        run: bun -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${{ needs.orchestrate.outputs.version }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
        working-directory: app

      - name: Build desktop bundle
        run: bun run build
        working-directory: app

      - name: Upload private Linux source maps
        uses: actions/upload-artifact@v6
        with:
          name: desktop-sourcemaps-linux
          path: app/out/**/*.map
          if-no-files-found: ignore

      - name: Remove source maps before packaging
        run: bun .github/scripts/remove-sourcemaps.mjs app/out

      - name: Package Linux app
        run: bunx electron-builder build --linux --publish never
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-dist-linux
          path: |
            app/dist/**/*.AppImage
            app/dist/**/*.deb

  build-desktop-windows:
    needs: orchestrate
    if: needs.orchestrate.outputs.include_desktop == 'true'
    runs-on: windows-latest
    env:
      MCPX_POSTHOG_PROJECT_TOKEN: ${{ vars.MCPX_POSTHOG_PROJECT_TOKEN }}
      MCPX_POSTHOG_HOST: ${{ vars.MCPX_POSTHOG_HOST }}
      MCPX_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      MCPX_SENTRY_RELEASE: mcpx@${{ needs.orchestrate.outputs.version }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile
        working-directory: cli

      - name: Build CLI for desktop daemon
        run: bun run build
        working-directory: cli

      - name: Upload private bundled CLI source maps (Windows)
        uses: actions/upload-artifact@v6
        with:
          name: desktop-cli-sourcemaps-windows
          path: cli/dist/**/*.js.map
          if-no-files-found: ignore

      - name: Remove bundled CLI source maps before packaging (Windows)
        run: bun .github/scripts/remove-sourcemaps.mjs cli/dist

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile
        working-directory: app

      - name: Set desktop version for build
        run: bun -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${{ needs.orchestrate.outputs.version }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
        working-directory: app

      - name: Build desktop bundle
        run: bun run build
        working-directory: app

      - name: Upload private Windows source maps
        uses: actions/upload-artifact@v6
        with:
          name: desktop-sourcemaps-windows
          path: app/out/**/*.map
          if-no-files-found: ignore

      - name: Remove source maps before packaging
        run: bun .github/scripts/remove-sourcemaps.mjs app/out

      - name: Package Windows app
        run: bunx electron-builder build --win --publish never
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-dist-windows
          path: |
            app/dist/**/*.exe
            app/dist/**/*.blockmap
            app/dist/**/latest*.yml

  publish-release:
    needs: [orchestrate, build-cli, build-desktop-macos, build-desktop-linux, build-desktop-windows]
    if: always() && needs.orchestrate.result == 'success' && (needs.build-cli.result == 'success' || needs.build-cli.result == 'skipped') && (needs.build-desktop-macos.result == 'success' || needs.build-desktop-macos.result == 'skipped') && (needs.build-desktop-linux.result == 'success' || needs.build-desktop-linux.result == 'skipped') && (needs.build-desktop-windows.result == 'success' || needs.build-desktop-windows.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile
        working-directory: cli

      - name: Set release versions
        if: needs.orchestrate.outputs.include_cli == 'true'
        run: |
          bun -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${{ needs.orchestrate.outputs.version }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          bun run sync-version
        working-directory: cli

      - name: Sync desktop version
        if: needs.orchestrate.outputs.include_desktop == 'true'
        run: bun -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${{ needs.orchestrate.outputs.version }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
        working-directory: app

      - name: Configure git
        if: needs.orchestrate.outputs.include_cli == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and tag release
        if: needs.orchestrate.outputs.include_cli == 'true'
        env:
          RELEASE_VERSION: ${{ needs.orchestrate.outputs.version }}
          RELEASE_TAG: ${{ needs.orchestrate.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          INCLUDE_CLI: ${{ needs.orchestrate.outputs.include_cli }}
          INCLUDE_DESKTOP: ${{ needs.orchestrate.outputs.include_desktop }}
        run: |
          git add cli/package.json cli/bun.lock cli/src/version.ts
          if [ "$INCLUDE_DESKTOP" = "true" ]; then git add app/package.json app/bun.lock; fi
          git commit -m "chore(release): v${RELEASE_VERSION} [skip ci]"
          TAG_BODY=$(bun .github/scripts/release-coordinator.mjs tag-body --source-sha "$SOURCE_SHA" --include-cli "$INCLUDE_CLI" --include-desktop "$INCLUDE_DESKTOP" --version "$RELEASE_VERSION")
          git tag -a "$RELEASE_TAG" -m "$TAG_BODY"
          git push origin "$RELEASE_TAG"

      - name: Set up Node.js for publish
        if: needs.orchestrate.outputs.include_cli == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download CLI tarball
        if: needs.orchestrate.outputs.include_cli == 'true'
        uses: actions/download-artifact@v6
        with:
          name: cli-tarball
          path: cli-tarball/

      - name: Download CLI artifacts
        if: needs.orchestrate.outputs.include_cli == 'true'
        uses: actions/download-artifact@v6
        with:
          name: cli-dist
          path: cli-dist/

      - name: Download CLI source maps
        if: needs.orchestrate.outputs.include_cli == 'true'
        uses: actions/download-artifact@v6
        with:
          name: cli-sourcemaps
          path: sentry-sourcemaps/cli/

      - name: Download bundled CLI source maps from macOS
        if: needs.orchestrate.outputs.include_desktop == 'true'
        uses: actions/download-artifact@v6
        with:
          name: desktop-cli-sourcemaps-macos
          path: sentry-sourcemaps/desktop-cli-macos/

      - name: Download bundled CLI source maps from Linux
        if: needs.orchestrate.outputs.include_desktop == 'true'
        uses: actions/download-artifact@v6
        with:
          name: desktop-cli-sourcemaps-linux
          path: sentry-sourcemaps/desktop-cli-linux/

      - name: Download bundled CLI source maps from Windows
        if: needs.orchestrate.outputs.include_desktop == 'true'
        uses: actions/download-artifact@v6
        with:
          name: desktop-cli-sourcemaps-windows
          path: sentry-sourcemaps/desktop-cli-windows/

      - name: Download macOS source maps
        if: needs.orchestrate.outputs.include_desktop == 'true'
        uses: actions/download-artifact@v6
        with:
          name: desktop-sourcemaps-macos
          path: sentry-sourcemaps/desktop-macos/

      - name: Download Linux source maps
        if: needs.orchestrate.outputs.include_desktop == 'true'
        uses: actions/download-artifact@v6
        with:
          name: desktop-sourcemaps-linux
          path: sentry-sourcemaps/desktop-linux/

      - name: Download Windows source maps
        if: needs.orchestrate.outputs.include_desktop == 'true'
        uses: actions/download-artifact@v6
        with:
          name: desktop-sourcemaps-windows
          path: sentry-sourcemaps/desktop-windows/

      - name: Upload private source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: mcpx@${{ needs.orchestrate.outputs.version }}
        run: |
          npx --yes @sentry/cli@2.47.0 releases new "$SENTRY_RELEASE"
          for target in cli desktop-cli-macos desktop-cli-linux desktop-cli-windows desktop-macos desktop-linux desktop-windows; do
            if [ -d "sentry-sourcemaps/$target" ]; then
              if [ "$target" = "cli" ]; then
                PREFIX="app:///cli/"
              elif [[ "$target" == desktop-cli-* ]]; then
                PREFIX="app:///$target/"
              else
                PREFIX="app:///out/"
              fi
              npx --yes @sentry/cli@2.47.0 sourcemaps upload "sentry-sourcemaps/$target" --release "$SENTRY_RELEASE" --rewrite --url-prefix "$PREFIX"
            fi
          done
          npx --yes @sentry/cli@2.47.0 releases finalize "$SENTRY_RELEASE"

      - name: Publish to npm
        if: needs.orchestrate.outputs.include_cli == 'true'
        run: npm publish ./cli-tarball/*.tgz --provenance --access public

      - name: Download macOS desktop artifacts
        if: needs.orchestrate.outputs.include_desktop == 'true'
        uses: actions/download-artifact@v6
        with:
          name: desktop-dist-macos
          path: desktop-dist-macos/

      - name: Download Linux desktop artifacts
        if: needs.orchestrate.outputs.include_desktop == 'true'
        uses: actions/download-artifact@v6
        with:
          name: desktop-dist-linux
          path: desktop-dist-linux/

      - name: Download Windows desktop artifacts
        if: needs.orchestrate.outputs.include_desktop == 'true'
        uses: actions/download-artifact@v6
        with:
          name: desktop-dist-windows
          path: desktop-dist-windows/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.orchestrate.outputs.tag }}
          body: ${{ needs.orchestrate.outputs.release_body }}
          draft: false
          overwrite_files: true
          files: |
            desktop-dist-macos/*.dmg
            desktop-dist-macos/*.zip
            desktop-dist-macos/*.blockmap
            desktop-dist-macos/*latest*.yml
            desktop-dist-linux/*.AppImage
            desktop-dist-linux/*.deb
            desktop-dist-windows/*.exe
            desktop-dist-windows/*.blockmap
            desktop-dist-windows/*latest*.yml
          fail_on_unmatched_files: false
